name: Paper One seven compressed figures — browser acceptance (no deploy)

on:
  push:
    branches:
      - feature/v2-paper-one-seven-cinematic-optimised-20261120
    paths:
      - .github/workflows/p1-seven-cinematic-browser-acceptance.yml
      - docs/reports/scripts/p1_seven_cinematic_browser_acceptance.py
      - articles/symmetria/symmetria-paper-01.html
      - css/v2-articles.css
      - images/symmetria/paper-01/approved-20261120/**

permissions:
  contents: read

jobs:
  paper-one-browser:
    name: Chromium 320/390/tablet/desktop + images, navigation and fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact unmerged PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser test runner and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify test script compiles
        run: python -m py_compile docs/reports/scripts/p1_seven_cinematic_browser_acceptance.py
      - name: Run local HTTP browser acceptance — no public preview
        run: python -u docs/reports/scripts/p1_seven_cinematic_browser_acceptance.py
      - name: Upload viewport screenshots, network measurements and QA JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symmetria-p1-pr11-browser-qa
          path: phase3-p1-browser-qa-artifacts/
          if-no-files-found: warn
          retention-days: 30

# No Pages action, publication environment, deployment, push token or merge operation.
